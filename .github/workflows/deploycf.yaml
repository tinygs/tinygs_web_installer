name: Cloudflare Pages Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Create deployment directory
        run: mkdir -p deploy

      - name: Copy files excluding .github
        run: |
          rsync -av --exclude='.github/' --exclude='.git/' . deploy/

      - name: Deploy to Cloudflare Pages (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=main